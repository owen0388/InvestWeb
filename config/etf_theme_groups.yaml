# 主题族：同一族内视为「重复暴露」，每日机会输出只保留分数最高的一只。
#
# 为什么需要这张表：候选池按「跟踪指数」去重，但"中证酒指数""中证消费50""中证主要消费"
# 是三个不同指数，经济上却是同一个主题。只按指数名去重，前 10 条会被同一板块占满。
#
# 匹配规则：名称命中关键词即归入该族；多个关键词命中时取最长的那个（更具体者优先）。
# 维护建议：只加你真会买的主题，族太细等于没分组，族太粗会把不相关标的合并。
version: 1

# 主题族中文名，用于生成机会标题（"消费 趋势转强" 而不是 "family:consumer"）
labels:
  consumer: 消费
  tech: 科技
  healthcare: 医药
  finance: 金融
  new_energy: 新能源
  military: 军工
  cyclical: 周期
  dividend: 红利
  realestate: 地产
  infrastructure: 基建
  rate_bond: 利率债
  credit_bond: 信用债
  broad_cn: 宽基

families:
  consumer: [消费, 白酒, 酒, 食品, 饮料, 家电, 旅游, 零售, 农业, 养殖, 乳业, 家居]
  tech: [半导体, 芯片, 科技, 通信, 电子, 软件, 计算机, 人工智能, 云计算, 游戏, 传媒, 数字经济]
  healthcare: [医药, 医疗, 生物, 创新药, 中药, 疫苗, 器械, 养老产业]
  finance: [银行, 证券, 券商, 保险, 金融, 非银]
  new_energy: [新能源, 光伏, 电池, 储能, 锂电, 风电, 碳中和, 汽车]
  military: [军工, 国防, 航天, 航空]
  cyclical: [有色, 钢铁, 煤炭, 化工, 建材, 稀土, 资源, 采掘]
  dividend: [红利, 股息, 低波, 价值]
  realestate: [地产, 房地产]
  infrastructure: [基建, 建筑, 交通, 公用事业]
  rate_bond: [国债, 政金债, 地方债, 基准做市国债, 政策性金融债]
  credit_bond: [公司债, 信用债, 短融, 可转债, 城投债]
  broad_cn: [沪深300, 中证500, 中证1000, 中证2000, 中证A500, 中证A50, 上证50, 上证指数, 创业板, 科创50, 科创100, 科创200]
